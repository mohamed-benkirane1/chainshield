[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chainshield"
version = "0.1.0"
description = "Defensive risk-assessment platform for crypto scams (decision support only, never proof of fraud)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "base58>=2.1",
    "eth-hash[pycryptodome]>=0.7",
    "eth-utils>=5.0",
    "fastapi>=0.115",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2.0",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
